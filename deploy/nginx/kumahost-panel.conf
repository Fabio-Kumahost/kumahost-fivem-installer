# =============================================================================
# KumaHost FiveM Webpanel — nginx site
# Serves the static panel and reverse-proxies /api to the Node backend.
# Placeholders (__KH_*__) are substituted by deploy/install-panel.sh.
# For HTTPS, run certbot --nginx after installation (handled by the installer).
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name __KH_SERVER_NAME__;

    root /opt/kumahost/webpanel;
    index index.html;

    # Static webpanel assets.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy → Node backend bound to localhost.
    location /api/ {
        proxy_pass http://127.0.0.1:__KH_API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;   # allow long installs/updates
        proxy_send_timeout 900s;
    }

    # Basic hardening headers (CSP is also set by the API via helmet).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 50m;
    gzip on;
    gzip_types text/css application/javascript application/json;
}
